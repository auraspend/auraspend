# F-Droid metadata — the fdroiddata entry (submitted as merge request !52537).
#
# The listing text, images and per-version changelogs live in the upstream
# Fastlane metadata (fastlane/metadata/android/, en-US + hi-IN), as the
# inclusion checklist requires — so this file deliberately does not repeat a
# summary or description.
#
# The `fdroid` flavor (app/build.gradle.kts) carries no Google Play Services:
# F-Droid's inclusion policy forbids the non-free dependency, and Drive backup
# is absent from this build. Everything else is identical to the Play build.
#
# `commit:` is a full hash (never a tag or branch) per the metadata rules; it
# pins the commit that added the upstream Fastlane metadata. AutoUpdateMode
# tracks release tags from here on.

