name: Play listing

# Dispatch-only. Uses the same PLAY_SERVICE_ACCOUNT_JSON secret as release.yml;
# no credentials or account identity are stored in the repository.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-title:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Google auth
        run: pip install --quiet google-auth requests
      - name: Update en-US title
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: python tools/update_play_listing.py
