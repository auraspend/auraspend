name: CI

# Push-only. Every PR used to run this workflow *and* pr_check.yml — the same
# unit tests and the same dev/prod assembles, twice, for no added signal
# (review finding 27). PRs are now gated by pr_check.yml alone, which also
# carries the licence check this workflow used to own.
#
# Pushes to main/dev still run the whole pipeline on purpose: this is the cache
# seeder. Caches are written on main and read everywhere (handoff 0023).
on:
  push:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # Three caches with different lifecycles:
      #  * setup-gradle: Gradle User Home (dependencies + build cache), keyed
      #    per commit with a prefix fallback to the most recent entry.
      #  * the wrapper cache: the Gradle distribution itself — setup-gradle
      #    does not include ~/.gradle/wrapper/dists.
      #  * the Robolectric cache: the android-all runtime jars Robolectric
      #    downloads (hundreds of MB into ~/.m2) on the first test run.
      - name: Cache Gradle distributions
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper/dists
          key: ${{ runner.os }}-gradle-wrapper-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-wrapper-

      - name: Cache Robolectric runtime jars
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository/org/robolectric
          key: ${{ runner.os }}-robolectric-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-robolectric-

      - name: Accept SDK licenses & install platform 37
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null

      - name: Unit tests
        run: ./gradlew testProdDebugUnitTest

      # Cheap, and it is the only thing standing between a relicensing mistake
      # and a shipped APK that misstates its own licence. It has already caught
      # one: the licence had silently drifted across eleven files.
      - name: Verify licence metadata and third-party attributions
        run: ./tools/check_license.sh

      # The same class of check for the app's privacy copy, and for the
      # website's. "Nothing leaves your phone" was written before Drive backup
      # existed and was still on screen two features later, while a backup
      # uploads the message queue (masked, but message text) as plain JSON. A
      # promise that drifts by omission needs a tripwire, not another review
      # comment. It is here as well as in pr_check.yml because this workflow
      # runs on the pushes to main that publish the site.
      - name: Verify privacy claims state their exception
        run: ./tools/check_privacy_claims.sh

      # The website claims to be a particular release in its structured data
      # and used to name a version in its download buttons and meta
      # descriptions. Those go stale the moment the next release is cut, and
      # they did: the site said 0.1.91 while the app was at 0.1.93.
      - name: Verify the site agrees with the app about the version
        run: ./tools/check_site_version.sh

      - name: Build dev flavor (debug)
        run: ./gradlew assembleDevDebug

      - name: Build prod flavor (debug)
        run: ./gradlew assembleProdDebug

      - name: Build prod release (full R8)
        run: ./gradlew assembleProdRelease
