name: Release

# Release build. Tags publish a GitHub Release with the two shippable
# artifacts AND upload the signed bundle to Google Play. It does NOT run on
# pull requests: a PR-triggered run needs the same environment approval as a
# real release, so every PR onto main (Dependabot's included) minted an
# approval request that was noise, not a gate (owner call, 2026-10-14). The
# only approval surfaces are the main-branch PR review and a real release run.
#
#   git tag v0.1.2 && git push origin v0.1.2
#
# Release assets are named AuraSpend-V<version>.Alpha.{aab,apk}, e.g.
#   AuraSpend-V0.1.2.Alpha.aab   (the bundle Play receives — also attached here)
#   AuraSpend-V0.1.2.Alpha.apk   (prod build for F-Droid / self-install / website)
# - Google Play: tag runs upload the AAB to the closed-testing track with the
#   per-language notes in docs/store/whatsnew/ (plain text, ≤500 chars each).
#   The track is `alpha` unless the PLAY_TRACK repository variable says
#   otherwise; a dispatch run never touches Play. To stage a release without
#   sending it for review, set `changesNotSentForReview: true` on the upload
#   step below.
#
# Signing: the build signs with the *upload key* (auraspend.jks, alias key0)
# from secrets.properties, which this workflow materialises from secrets on
# the `release` GitHub environment (four for signing, one for the Play
# upload). The keystore must be the existing upload key — a newly generated
# keystore is a different key and Play rejects the upload. Secrets:
#
#   KEYSTORE_BASE64            base64 of auraspend.jks
#   KEYSTORE_PASSWORD          keystore (store) password
#   KEY_ALIAS                  key0
#   KEY_PASSWORD               key password
#   PLAY_SERVICE_ACCOUNT_JSON  a Google Play Console service-account key.
#                              Its identity is deliberately not recorded
#                              anywhere in this repository.
#
# The environment is the gate: it requires a reviewer (the maintainer approves
# every run that uses it) and only `main` and `v*` tags may reach it — a
# dispatch from any other branch cannot. Releases are published by tags only.
# Anyone can read this workflow; nobody can read the values, and GitHub never
# exposes them to forks or fork pull requests.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # publish the Release Drafter draft and attach assets

jobs:
  build:
    runs-on: ubuntu-latest
    # Gates the signing secrets: a required reviewer approves every release
    # run, and only `main` and `v*` tags may use the environment.
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Accept SDK licenses & install platform 37
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null

      # Fail before building if a required secret is missing — otherwise the
      # build would "succeed" and silently produce ...-unsigned artifacts.
      # Tag runs also upload to Play, so they additionally require the
      # service-account secret; a dispatch run never touches Play.
      - name: Write signing config from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          required="KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD"
          if [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
            required="$required PLAY_SERVICE_ACCOUNT_JSON"
          fi
          missing=0
          for name in $required; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing secret $name — see the header of this workflow."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "$KEYSTORE_BASE64" | base64 -d > auraspend-upload.jks
          {
            echo "KEYSTORE_PATH=auraspend-upload.jks"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } > secrets.properties

      - name: Verify licence metadata and third-party attributions
        run: ./tools/check_license.sh

      - name: Build signed Play bundle and prod APK
        run: ./gradlew :app:bundleProdRelease :app:assembleProdRelease

      # AGP names an unsigned build `...-unsigned.apk`, so an existing signed
      # filename is the floor — plus a real signature check on both artifacts.
      - name: Verify artifacts are signed
        run: |
          set -e
          AAB=app/build/outputs/bundle/prodRelease/app-prod-release.aab
          APK=app/build/outputs/apk/prod/release/app-prod-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::No signed prod APK. An unsigned build is named app-prod-release-unsigned.apk — the signing config was not applied."
            ls -la app/build/outputs/apk/prod/release/ || true
            exit 1
          fi
          test -f "$AAB" || { echo "::error::Play AAB missing"; ls -la app/build/outputs/bundle/prodRelease/ || true; exit 1; }
          jarsigner -verify "$AAB" > /dev/null
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$APK" > /dev/null
          echo "Both artifacts verified signed."

      # Release convention: AuraSpend-V<version>.Alpha.{aab,apk}, matching the
      # other AW Builds apps. The version comes from the pushed tag when it
      # looks like vX.Y.Z; a manual dispatch falls back to versionName in
      # app/build.gradle.kts. Play itself does not care about the file name.
      - name: Name artifacts (AuraSpend-V<version>.Alpha)
        id: names
        run: |
          set -e
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          BUILD_VERSION=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | head -1 | sed 's/versionName = "//; s/"$//')
          if [[ "$TAG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            VERSION="$TAG_VERSION"
            if [ "$VERSION" != "$BUILD_VERSION" ]; then
              echo "::warning::Tag version $VERSION differs from versionName $BUILD_VERSION — the file name follows the tag."
            fi
          else
            VERSION="$BUILD_VERSION"
          fi
          BASE="AuraSpend-V${VERSION}.Alpha"
          mkdir -p dist
          cp app/build/outputs/bundle/prodRelease/app-prod-release.aab "dist/${BASE}.aab"
          cp app/build/outputs/apk/prod/release/app-prod-release.apk "dist/${BASE}.apk"
          (cd dist && sha256sum "${BASE}.aab" "${BASE}.apk" > SHA256SUMS)
          echo "base=${BASE}" >> "$GITHUB_OUTPUT"
          ls -la dist

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: auraspend-release-${{ github.run_number }}.${{ github.run_attempt }}
          path: |
            dist/${{ steps.names.outputs.base }}.aab
            dist/${{ steps.names.outputs.base }}.apk
            dist/SHA256SUMS
          if-no-files-found: error

      # Tags upload the signed bundle to Google Play, with the per-language
      # "what's new" notes from docs/store/whatsnew/ (plain text, ≤500 chars,
      # files named whatsnew-<locale>) and the R8 mapping for crash reports.
      # `status: completed` assigns the release to the track and sends it for
      # review; set `changesNotSentForReview: true` to stage it for a manual
      # send instead. Never runs on a dispatch.
      - name: Upload to Google Play
        if: startsWith(github.ref, 'refs/tags/')
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.awbuilds.auraspend
          releaseFiles: dist/${{ steps.names.outputs.base }}.aab
          tracks: ${{ vars.PLAY_TRACK || 'alpha' }}
          status: completed
          whatsNewDirectory: docs/store/whatsnew
          mappingFile: app/build/outputs/mapping/prodRelease/mapping.txt

      - name: Check whether this tag already has a release
        id: release_exists
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Release Drafter keeps a rolling draft with categorised notes
      # (.github/release-drafter.yml). Pushing a tag publishes that draft under
      # the tag instead of inventing a second notes format.
      - name: Publish release notes (Release Drafter)
        if: startsWith(github.ref, 'refs/tags/') && steps.release_exists.outputs.exists == 'false'
        uses: release-drafter/release-drafter@v6
        with:
          publish: true
          tag: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach AAB, APK and checksums to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "dist/${{ steps.names.outputs.base }}.aab" \
            "dist/${{ steps.names.outputs.base }}.apk" \
            dist/SHA256SUMS \
            --clobber
