# AuraSpend version catalog — single source of truth for all dependency versions.
# Compose is aligned through the BOM (androidx.compose:compose-bom).
# Material 3 is pinned by the BOM at 1.4.0 (M3 Expressive APIs available).

[versions]
agp = "9.3.1"
kotlin = "2.2.10"
# Coroutines: pinned to the version the AndroidX/Compose stack already resolves
# (1.9.0) so the test artefact cannot drag a second one onto the classpath.
kotlinxCoroutines = "1.9.0"
ksp = "2.2.10-2.0.2"

composeBom = "2026.09.00"
coreKtx = "1.19.0"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
navigation = "2.10.1"

room = "2.8.5"
# SQLCipher Community Edition, the androidx-compatible artifact (it tracks
# androidx.sqlite; the old `android-database-sqlcipher` is the legacy API).
sqlcipher = "4.19.1"
work = "2.10.0"
profileinstaller = "1.4.1"
androidxBiometric = "1.1.0"

okhttp = "4.12.0"
playServicesAuth = "21.6.0"
googleApiClient = "2.9.0"
googleApiServicesDrive = "v3-rev20230822-2.0.0"
playAppUpdate = "2.1.0"
googleHttpClientGson = "1.44.2"

# Wired: Room's PagingSource integration plus collectAsLazyPagingItems back the
# Activity list.
paging = "3.5.1"

junit = "4.13.2"
testExtJunit = "1.3.0"
robolectric = "4.17"
testCore = "1.7.0"
benchmarkMacro = "1.5.0"
uiautomator = "2.4.0"
testRunner = "1.7.0"
# Espresso 3.7.0 rather than the 3.5.0 that Compose's test rule pulls
# transitively: 3.5.0 probes `InputManager.getInstance()`, removed in API 37,
# so every Compose assertion on the current emulator image died in onIdle.
espresso = "3.7.0"

onnxruntime = "1.22.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
# viewModel() + ViewModel factories. Without this, screens had to fall back to
# remember { ViewModel(...) }, which loses state on rotation and leaks coroutine scopes.
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }

# Compose — versions come from the BOM.
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
 # ONNX Runtime Mobile. Ships prebuilt native .so files, so it is covered by
 # tools/audit_native_runtime.sh like any other prebuilt binary. Pinned rather
 # than latest: 1.30 ships a ~50 MB AAR against this one's 27.2 MB for no
 # capability this app uses.
 #
 # An earlier version of this comment claimed 1.20 was "rejected outright"
 # because its arm64 .so was not 16 KB aligned. That was never verified and is
 # not true. Measured 2026-09-29: 1.20.0 and 1.22.0 both have PT_LOAD align
 # 2**14 (16384) on arm64-v8a, both deflate their .so inside the AAR, and the
 # packaged release APK passes `zipalign -c -P 16`. The pin stays because 1.22
 # is the version the golden corpus was measured against — not because 1.20
 # is broken. Re-derive before changing it.
onnxruntime-android = { group = "com.microsoft.onnxruntime", name = "onnxruntime-android", version.ref = "onnxruntime" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-paging = { group = "androidx.room", name = "room-paging", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
sqlcipher-android = { group = "net.zetetic", name = "sqlcipher-android", version.ref = "sqlcipher" }

androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
androidx-profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version.ref = "profileinstaller" }
androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "androidxBiometric" }

okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
play-services-auth = { group = "com.google.android.gms", name = "play-services-auth", version.ref = "playServicesAuth" }
google-api-services-drive = { group = "com.google.apis", name = "google-api-services-drive", version.ref = "googleApiServicesDrive" }
google-api-client = { group = "com.google.api-client", name = "google-api-client", version.ref = "googleApiClient" }
google-api-client-android = { group = "com.google.api-client", name = "google-api-client-android", version.ref = "googleApiClient" }
google-http-client-gson = { group = "com.google.http-client", name = "google-http-client-gson", version.ref = "googleHttpClientGson" }
play-app-update = { group = "com.google.android.play", name = "app-update", version.ref = "playAppUpdate" }
# Guava is on the classpath transitively (google-api-client / google-http-client
# require it) and is attributed on that basis — no direct declaration, because
# nothing in app/src imports com.google.common.

androidx-paging-compose = { group = "androidx.paging", name = "paging-compose", version.ref = "paging" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "testExtJunit" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "testCore" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "testRunner" }
androidx-test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
androidx-benchmark-macro-junit4 = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "benchmarkMacro" }
androidx-uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "uiautomator" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
