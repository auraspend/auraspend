# The currency picker, and the promise it makes.
#
# The caveat — "Amounts are not converted — this changes how money is
# displayed" — sits **above** the list, and that placement is load-bearing: a
# Column measures its children in order, so a non-weighted LazyColumn placed
# first takes the entire bounded height and the note is then measured against
# zero remaining. On the first on-device run the caveat rendered as nothing at
# all, while the list and the button were fine. Asserting it is visible is the
# regression test.
#
# The flow ends back on the device's own currency, so the suite is left in the
# state the rest of the flows expect.
appId: com.awbuilds.auraspend.dev
name: 09 · Currency
tags:
  - settings
  - currency
---
- launchApp:
    appId: com.awbuilds.auraspend.dev

# Leave an open sheet, then a pushed screen, if the last flow left the app
# on one. `launchApp` brings the existing task forward and the navigation
# stack comes back with it, so the app can resume on Settings, on
# Categories, or with the currency sheet open — none of which have a
# navigation bar to tap.
- runFlow:
    when:
      visible: "Close sheet"
    commands:
      - tapOn: "Close sheet"
- runFlow:
    when:
      visible: "Back"
    commands:
      - back

# The settings entry is the avatar in the top-right of every tab. It carries a
# content description, so it is tapped by name rather than by position.
- tapOn: "Settings"

# Back to the top of the Settings list.
- scrollUntilVisible:
    element:
      text: "MONEY"
    direction: UP
    centerElement: true

- tapOn: "Currency"

# The caveat, and the device's own currency offered first.
- assertVisible: "Amounts are not converted — this changes how money is displayed."
- assertVisible: "Match my device"

# Pick dollars. USD is near the end of the catalogue, so the list is scrolled
# to it first.
- scrollUntilVisible:
    element:
      text: "USD"
    direction: DOWN
    centerElement: true
- tapOn: "USD"
- assertVisible: ".*USD.*"

# Back out of Settings, and the whole app has changed — the Home screen's
# money is in dollars now. (The sheet closed on the choice, so one `back`
# leaves Settings, not two.)
- back
- tapOn: "Home"
- scrollUntilVisible:
    element:
      text: "AVAILABLE"
    direction: UP
    centerElement: true
- assertVisible: "\\$[0-9,.]+"

# And back to the device's own currency, which is the rupee.
- tapOn: "Settings"
- scrollUntilVisible:
    element:
      text: "MONEY"
    direction: UP
    centerElement: true
- tapOn: "Currency"
- scrollUntilVisible:
    element:
      text: "Match my device"
    direction: UP
    centerElement: true
- tapOn: "Match my device"
- back
- tapOn: "Home"
- scrollUntilVisible:
    element:
      text: "AVAILABLE"
    direction: UP
    centerElement: true
- assertVisible: "₹[0-9,.]+"
