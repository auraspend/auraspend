# The theme: light, dark and AMOLED, and the System default.
#
# The app has four theme modes. AMOLED is a true-black canvas, which is not
# the same as dark — it is the one where a dark-on-dark mistake would be
# invisible rather than merely ugly, so it is worth a look.
#
# The theme applies live, with no restart, and the choice is remembered.
appId: com.awbuilds.auraspend.dev
name: 08 · Theme
tags:
  - settings
  - theme
---
- launchApp:
    appId: com.awbuilds.auraspend.dev

# Leave an open sheet, then a pushed screen, if the last flow left the app
# on one. `launchApp` brings the existing task forward and the navigation
# stack comes back with it, so the app can resume on Settings, on
# Categories, or with the currency sheet open — none of which have a
# navigation bar to tap.
- runFlow:
    when:
      visible: "Close sheet"
    commands:
      - tapOn: "Close sheet"
- runFlow:
    when:
      visible: "Back"
    commands:
      - back

# The settings entry is the avatar in the top-right of every tab. It carries a
# content description, so it is tapped by name rather than by position. On the
# Settings screen itself "Settings" is also the screen's title, which is why
# every flow leaves that screen with `back` before looking for the avatar.
- tapOn: "Settings"

# Back to the top of the Settings list.
- scrollUntilVisible:
    element:
      text: "MONEY"
    direction: UP
    centerElement: true

- assertVisible: "Settings"
- scrollUntilVisible:
    element:
      text: "Theme"
    direction: DOWN
    centerElement: true
- tapOn: "Theme"

# The sheet lists the four modes.
- assertVisible: "System"
- assertVisible: "Light"
- assertVisible: "Dark"
- assertVisible: "AMOLED"

# Choose AMOLED. The sheet closes on the choice, and the row shows what was
# chosen.
- tapOn: "AMOLED"
- assertVisible: "AMOLED"
- assertVisible: "Theme"

# Back out of Settings, and onto the Home tab.
- back
- tapOn: "Home"
- scrollUntilVisible:
    element:
      text: "AVAILABLE"
    direction: UP
    centerElement: true
- assertVisible: "AVAILABLE"

# ── Back to the system default ──────────────────────────────────────────────
- tapOn: "Settings"
- scrollUntilVisible:
    element:
      text: "MONEY"
    direction: UP
    centerElement: true
- scrollUntilVisible:
    element:
      text: "Theme"
    direction: DOWN
    centerElement: true
- tapOn: "Theme"
- tapOn: "System"
- assertVisible: "System"
- back
- tapOn: "Home"
- scrollUntilVisible:
    element:
      text: "AVAILABLE"
    direction: UP
    centerElement: true
- assertVisible: "AVAILABLE"
