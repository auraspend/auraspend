# Insights: the period selector, the ranked categories, and the drill-down.
#
# The drill-down is the part worth testing: tapping a category must land on
# Activity, filtered to that category and nothing else.
appId: com.awbuilds.auraspend.dev
name: 05 · Insights
tags:
  - insights
---
- launchApp:
    appId: com.awbuilds.auraspend.dev

# Leave an open sheet, then a pushed screen, if the last flow left the app
# on one. `launchApp` brings the existing task forward and the navigation
# stack comes back with it, so the app can resume on Settings, on
# Categories, or with the currency sheet open — none of which have a
# navigation bar to tap.
- runFlow:
    when:
      visible: "Close sheet"
    commands:
      - tapOn: "Close sheet"
- runFlow:
    when:
      visible: "Back"
    commands:
      - back

- tapOn: "Insights"

# The list keeps its scroll position between launches, so every flow scrolls
# back to the top first. `centerElement` is what makes this exact: the
# element is brought to the middle of the viewport, and the top of a list
# cannot be scrolled past.
#
# A swipe is not used for this. A drag that starts over the cash-flow chart
# is swallowed by the chart's own gesture handling and the list does not
# move, and a bare `direction: DOWN` starts at the system status bar and
# pulls the notification shade down over the app.
- scrollUntilVisible:
    element:
      text: "SPENT THIS MONTH"
    direction: UP
    centerElement: true

- assertVisible: "SPENT THIS MONTH"
- assertVisible: "Where it went"
- assertVisible: "Daily spending"

# The period selector: this month, the last 30 days, all time.
- assertVisible: "This month"
- assertVisible: "Last 30 days"
- assertVisible: "All time"

# The ranked categories, capped at six with the tail summed.
- assertVisible: "Transfer"
- assertVisible: "Shopping"
- assertVisible: "Grocery"
- assertVisible: "Education"
- assertVisible: "Food & Dining"
- assertVisible: ".*more categories.*"

# The merchants.
- scrollUntilVisible:
    element:
      text: "Top merchants"
    direction: DOWN
    centerElement: true
- assertVisible: "Top merchants"

# ── Drill-down ─────────────────────────────────────────────────────────────
# A category opens Activity, filtered to that category.
- scrollUntilVisible:
    element:
      text: "Shopping"
    direction: UP
    centerElement: true
- tapOn: "Shopping"
- assertVisible: "Search merchant or note"
- assertVisible: "Food & Dining|Shopping"
- back
- assertVisible: "SPENT THIS MONTH"

# ── The period selector actually changes the period ────────────────────────
- tapOn: "All time"
- assertVisible: "SPENT THIS MONTH|SPENT IN TOTAL|SPENT ALL TIME"
- tapOn: "This month"
- assertVisible: "SPENT THIS MONTH"
