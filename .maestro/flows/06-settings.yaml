# Settings: every group, and the honest states of the optional features.
#
# The interesting part is what the app says when the optional things are
# *not* there. Auto-categorisation is off by default, the model is not
# downloaded, SMS access is not granted — and each of those must say so
# plainly rather than pretending the feature is on.
appId: com.awbuilds.auraspend.dev
name: 06 · Settings
tags:
  - settings
---
- launchApp:
    appId: com.awbuilds.auraspend.dev

# Leave an open sheet, then a pushed screen, if the last flow left the app
# on one. `launchApp` brings the existing task forward and the navigation
# stack comes back with it, so the app can resume on Settings, on
# Categories, or with the currency sheet open — none of which have a
# navigation bar to tap.
- runFlow:
    when:
      visible: "Close sheet"
    commands:
      - tapOn: "Close sheet"
- runFlow:
    when:
      visible: "Back"
    commands:
      - back

# The settings entry is the avatar in the top-right of every tab. It carries a
# content description, so it is tapped by name rather than by position.
- tapOn: "Settings"

# The list keeps its scroll position between launches, so every flow scrolls
# back to the top first. `centerElement` is what makes this exact: the
# element is brought to the middle of the viewport, and the top of a list
# cannot be scrolled past.
#
# A swipe is not used for this. A drag that starts over the cash-flow chart
# is swallowed by the chart's own gesture handling and the list does not
# move, and a bare `direction: DOWN` starts at the system status bar and
# pulls the notification shade down over the app.
- scrollUntilVisible:
    element:
      text: "MONEY"
    direction: UP
    centerElement: true

- assertVisible: "Settings"

# ── Money ──────────────────────────────────────────────────────────────────
- assertVisible: "MONEY"
- assertVisible: "Currency"
- assertVisible: "Categories"
- assertVisible: "Subscriptions"
- assertVisible: "Budgets"

# ── Messages ───────────────────────────────────────────────────────────────
- assertVisible: "MESSAGES"
- assertVisible: "SMS access"
- assertVisible: "Review queue"
- assertVisible: "Auto-categorize messages"

# ── Appearance ─────────────────────────────────────────────────────────────
- scrollUntilVisible:
    element:
      text: "Theme"
    direction: DOWN
    centerElement: true
- assertVisible: "Theme"
- assertVisible: "Dynamic color"
- assertVisible: "App lock"

# ── Data ───────────────────────────────────────────────────────────────────
- scrollUntilVisible:
    element:
      text: "Export to CSV"
    direction: DOWN
    centerElement: true
- assertVisible: "DATA"
- assertVisible: "Back up to Google Drive"
- assertVisible: "Restore from Google Drive"
- assertVisible: "Export to CSV"
- assertVisible: "Import from CSV"
- assertVisible: "Delete all data"

# ── About ──────────────────────────────────────────────────────────────────
- scrollUntilVisible:
    element:
      text: "Open-source licenses"
    direction: DOWN
    centerElement: true
- assertVisible: "ABOUT"
- assertVisible: "Open-source licenses"
- assertVisible: "View on GitHub"
- assertVisible: ".*AGPL-3.0.*"
- assertVisible: "Made with.*"
