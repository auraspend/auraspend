# The app lock: set a PIN, lock the app, and get back in.
#
# The PIN is stored as a salted PBKDF2 hash, so the app can only check it, not
# read it — which means a wrong PIN must be rejected, and a forgotten one
# wipes the data rather than offering a back door. Both are asserted here.
#
# The PIN is entered on a keypad, not in a text field, and the dialog moves on
# by itself once four digits are in: "Set a PIN" becomes "Confirm your PIN".
#
# The flow leaves the app lock off again, so the rest of the suite is not
# locked out.
appId: com.awbuilds.auraspend.dev
name: 10 · App lock
tags:
  - settings
  - applock
---
- launchApp:
    appId: com.awbuilds.auraspend.dev

# Leave an open sheet, then a pushed screen, if the last flow left the app
# on one. `launchApp` brings the existing task forward and the navigation
# stack comes back with it, so the app can resume on Settings, on
# Categories, or with the currency sheet open — none of which have a
# navigation bar to tap.
- runFlow:
    when:
      visible: "Close sheet"
    commands:
      - tapOn: "Close sheet"
- runFlow:
    when:
      visible: "Back"
    commands:
      - back

# The settings entry is the avatar in the top-right of every tab. It carries a
# content description, so it is tapped by name rather than by position.
- tapOn: "Settings"

# Back to the top of the Settings list.
- scrollUntilVisible:
    element:
      text: "MONEY"
    direction: UP
    centerElement: true

# The app-lock switch, which is a labelled control in its own right.
- scrollUntilVisible:
    element:
      text: "App lock"
    direction: DOWN
    centerElement: true
- tapOn: "App lock"

# Set the PIN. The dialog advances to the confirmation on its own.
- assertVisible: "Set a PIN"
- tapOn: "2"
- tapOn: "4"
- tapOn: "6"
- tapOn: "8"
- assertVisible: "Confirm your PIN"
- tapOn: "2"
- tapOn: "4"
- tapOn: "6"
- tapOn: "8"

# The dialog is gone, and the lock is on. (The screen's title scrolls away with
# the list, so the row itself is what is checked.)
- assertVisible: "App lock"

# The app is locked now. Relaunching it must ask for the PIN.
- launchApp:
    appId: com.awbuilds.auraspend.dev
- assertVisible: "Enter your PIN"

# A wrong PIN is rejected, and the app does not let itself in.
- tapOn: "1"
- tapOn: "1"
- tapOn: "1"
- tapOn: "1"
- assertVisible: "Wrong PIN — try again"
- assertVisible: "Enter your PIN"

# The right one gets in.
- tapOn: "2"
- tapOn: "4"
- tapOn: "6"
- tapOn: "8"
- assertVisible: "AVAILABLE"

# ── Turn it off again ──────────────────────────────────────────────────────
- tapOn: "Settings"
- scrollUntilVisible:
    element:
      text: "App lock"
    direction: DOWN
    centerElement: true
- tapOn: "App lock"
- assertVisible: "Enter your current PIN"
- tapOn: "2"
- tapOn: "4"
- tapOn: "6"
- tapOn: "8"
- assertVisible: "App lock"
